name: Canvas HTTP contract

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: canvas-contract-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-baseline:
    name: Canvas Go HTTP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/canvas-contract/browser/requirements.txt
      - name: Install baseline host utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lsof ripgrep
      - name: Install real frontend and isolated browser prerequisites
        run: |
          cd web && bun install --frozen-lockfile && cd ..
          python -m pip install -r tests/canvas-contract/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Detached suite checks and repeated Go HTTP baseline
        run: bash tests/canvas-contract/ci.sh --browser
      - name: Upload redacted baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-contract-go-baseline
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .local/project-workbench-debug/canvas-contract-review/*/evidence.txt
            .local/project-workbench-debug/canvas-contract-review/*/report-round-*.json
            .local/project-workbench-debug/canvas-contract-review/*/*/result.jsonl
            .local/project-workbench-debug/canvas-contract-review/*/*/routes.log
            .local/project-workbench-debug/canvas-contract-review/*/*/browser-report.json
