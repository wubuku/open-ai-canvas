version: 1
name: canvas-http-contract
description: >-
  Implementation-independent HTTP black-box contract suite for the canvas
  document, sharing, imports, project/workbench links, resource integrity,
  asset compatibility, and their explicitly separated task/Agent dependencies.
suite:
  root: tests/canvas-contract
  runner: canvas_contract_test.go
  command: go test ./... -count=1 -v
  wire_schema:
    version: v1-observed
    registry: tests/canvas-contract/contract/schemas/bindings.v1.json
    approval: pending

# This manifest is the migration coverage index. Observed wire schemas do not
# approve current Go defects or replace the incomplete published OpenAPI.
# Java and Go do not get separate scenario or assertion definitions.
coverage_policy:
  unit: method-path-plus-branch-and-state-flow
  direct_canvas_routes: 14
  direct_canvas_route_breakdown:
    core_document: 7
    share_public: 5
    import: 2
  dependency_route_families:
    project_workbench: cataloged-separately
    resource_and_asset_library: cataloged-separately
    generation_and_agent_writeback: separate-suite
  dependency_kind: fixture-and-cross-suite-gate-not-java-module-import
  compatibility_default: UNKNOWN
  current_writer_default: go
  target_writer_default: UNASSIGNED_BEFORE_CONTRACT_APPROVAL
  route_prefixes:
    - /api/canvas-projects
    - /api/public/canvas-shares
    - /api/projects
    - /api/characters
    - /api/voice-profiles
    - /api/resources
    - /api/public/resources
    - /api/assets
    - /api/asset-folders
    - /api/user-data/snapshot
    - /api/tasks
    - /api/creation-runs
    - /api/agent
  catalog_rule: >-
    Every route family discovered in the current handler registration is either
    mapped to an executable scenario, marked DEFERRED with a blocker, or marked
    OUT_OF_SCOPE with an owning suite. A green profile never implies that an
    unexecuted dependency family is covered.
  rule: >-
    A profile is not covered because its route is listed here. It is covered
    only when its mapped scenario is implemented and executed against the
    target. Deferred and out-of-scope operations remain visible in reports.
controlled_faults:
  - id: upload-body-half-close
    kind: request-body-half-close
    profile: resource-integrity
    scenario: canvas.resource.upload.interrupted-chunk-recovery
    method: PUT
    path: /api/resources/uploads/{id}/chunks/{index}
    declared_body_bytes: 13
    sent_body_bytes: 6
    expected_status: 400
    requests_per_scenario: 2
    evidence: [tests/canvas-contract/runner/interrupted_upload.go, tests/canvas-contract/resource_transport_contract_test.go]
  - id: document-response-loss
    kind: response-loss-after-commit
    profile: restart-recovery
    scenario: canvas.recovery.response-loss-and-restart
    method: PUT
    path: /api/canvas-projects/{id}
    expected_status: 0
    target_status: 200
    requests_per_scenario: 1
    recovery_operations: [canvas.recovery.document, canvas.recovery.history]
    recovery_restart: {mode: crash, generation: 4}
    evidence: [tests/canvas-contract/runner/response_loss.go, tests/canvas-contract/response_loss_contract_test.go]
  - id: resource-create-response-loss
    kind: response-loss-after-commit
    profile: restart-recovery
    scenario: canvas.recovery.response-loss-and-restart
    method: POST
    path: /api/resources
    expected_status: 0
    target_status: 200
    requests_per_scenario: 1
    recovery_operations: [canvas.recovery.resource-create, canvas.recovery.resource, canvas.recovery.resource-usage]
    recovery_restart: {mode: crash, generation: 4}
    evidence: [tests/canvas-contract/runner/response_loss.go, tests/canvas-contract/response_loss_contract_test.go]
  - id: upload-complete-response-loss
    kind: response-loss-after-commit
    profile: restart-recovery
    scenario: canvas.recovery.response-loss-and-restart
    method: POST
    path: /api/resources/uploads/{id}/complete
    expected_status: 0
    target_status: 200
    requests_per_scenario: 1
    recovery_operations: [canvas.recovery.resource-create, canvas.recovery.resource, canvas.recovery.resource-usage]
    recovery_restart: {mode: crash, generation: 4}
    evidence: [tests/canvas-contract/runner/response_loss.go, tests/canvas-contract/response_loss_contract_test.go]
  - id: resource-import-response-loss
    kind: response-loss-after-commit
    profile: restart-recovery
    scenario: canvas.recovery.response-loss-and-restart
    method: POST
    path: /api/resources/import
    expected_status: 0
    target_status: 200
    requests_per_scenario: 1
    recovery_operations: [canvas.recovery.resource-import, canvas.recovery.resource, canvas.recovery.resource-usage]
    recovery_restart: {mode: crash, generation: 4}
    evidence: [tests/canvas-contract/runner/response_loss.go, tests/canvas-contract/response_loss_contract_test.go]
behavior_decisions:
  - id: D-01
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.authz.foreign-delete, canvas.delete]
    go_observation: Foreign DELETE returns success but leaves the owner's document intact.
    proposed_target: Uniform owner-scoped denial without an existence oracle; exact status still needs approval.
    evidence: [backend/internal/canvas/user_data.go, tests/canvas-contract/canvas_contract_test.go]
  - id: D-02
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.canvas.list, project.overview, project.unit.list, project.unit.workspace, canvas.import.libtv, canvas.import.tapnow]
    go_observation: These selected foreign/missing-resource paths currently return 500/internal rather than an authorization/not-found facet.
    proposed_target: Owner-scoped errors with stable status/code/reason and no task/resource existence oracle.
    evidence: [tests/canvas-contract/canvas_contract_test.go, tests/canvas-contract/fixed_import_contract_test.go]
  - id: D-03
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.canvas.link, project.canvas.list, project.canvas.unlink, project.canvas.unlink-unit]
    go_observation: Sequential reassociation changes the canvas project/revision but leaves an old full-detail unit link; the old project's paged canvases are empty and old-project unlink returns 400. Selected concurrent cross-project trials acknowledge both links, advance the canvas twice and each project once, and retain both full-detail links while only the authoritative project's page includes the canvas. Old-project unit/project unlink and stale CAS reject without changing either project's complete units or canvas/history. Detaching the current project leaves the old link; explicit reassociation then detach repairs it. The winning project is read from authoritative canvas state, never inferred from response completion order. These are HTTP settlement observations, not controlled database interleaving.
    proposed_target: Decide reject-versus-atomic-move semantics; do not require Java to preserve a stale relationship or the Go transaction boundaries.
    evidence: [backend/internal/app/project.go, backend/internal/repository/repository_projects.go, tests/canvas-contract/project_matrix_contract_test.go, tests/canvas-contract/project_link_race_contract_test.go]
  - id: D-04
    classification: UNKNOWN
    proposal: APPROVED_CHANGE
    approval: pending
    operations: [canvas.resource.create, canvas.resource.import]
    go_observation: Ready-upload replay compares kind/MIME/size, not a content fingerprint; URL replay downloads again and can fail before returning the existing resource.
    proposed_target: Explicit user-scoped idempotency and content identity; decide whether replay must contact the upstream, without copying Go storage state.
    evidence: [backend/internal/app/resource_store.go, tests/canvas-contract/resource_import_contract_test.go]
  - id: D-05
    classification: UNKNOWN
    proposal: APPROVED_CHANGE
    approval: pending
    operations: [canvas.recovery.upload-session, canvas.resource.upload.create, canvas.resource.upload.chunk, canvas.resource.upload.complete]
    go_observation: Go process restart invalidates the in-memory upload session; a new session is needed while committed resources remain readable.
    proposed_target: Decide durable-versus-volatile session recovery and cleanup policy; Java must not inherit Go's in-memory architecture by default.
    evidence: [tests/canvas-contract/restart_contract_test.go, backend/internal/handler/resource_upload_session.go]
  - id: D-06
    classification: UNKNOWN
    proposal: APPROVED_CHANGE
    approval: pending
    operations: [canvas.legacy-asset.batch-delete, canvas.legacy-asset.delete, canvas.history.restore]
    go_observation: Explicit purge can leave document references broken; later repair removes missing references and old-history restore is rejected.
    proposed_target: Decide reference protection, purge authorization and physical-delete recovery independently of current Go behavior.
    evidence: [tests/canvas-contract/canvas_contract_test.go, backend/internal/app/resource_delete.go]
  - id: D-07
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.resource.import]
    go_observation: Direct unsafe URLs return 400; denied redirect, immediate upstream failure and truncated body currently return 500/internal.
    proposed_target: Stable failure facets distinguishing invalid input, SSRF rejection, upstream failure and ambiguous transport state; preserve outbound safety.
    evidence: [tests/canvas-contract/resource_import_contract_test.go, backend/internal/app/resource_generated.go]
  - id: D-08
    classification: UNKNOWN
    proposal: APPROVED_CHANGE
    approval: pending
    operations: [canvas.import.libtv, canvas.import.tapnow]
    go_observation: Fixed-origin import errors, empty convertible canvas and the 20-second upstream deadline currently return 500/internal.
    proposed_target: Explicit timeout/error/empty-conversion contracts; no paid or non-idempotent upstream retry is implied by a timeout.
    evidence: [tests/canvas-contract/fixed_import_contract_test.go, backend/internal/auth/libtv.go, backend/internal/auth/tapnow.go]
  - id: D-09
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [canvas.import.libtv, canvas.import.tapnow]
    go_observation: Each successful conversion allocates new batch/node/connection identities and returns a converted graph; it does not persist canvas/history/resources.
    proposed_target: Retain the conversion-versus-persistence boundary and internal edge-to-node identity consistency; approve replay identity semantics separately.
    evidence: [tests/canvas-contract/fixed_import_contract_test.go, backend/internal/handler/user_data.go]
  - id: D-10
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [canvas.resource.create, canvas.resource.import, canvas.resource.upload.create]
    go_observation: Single-file, daily and stored-byte reservation limits are exclusive; exact limits reject. Ready replay is not charged twice; concurrent daily reservations prevent overshoot. Active upload slots are scoped per user and released on completion. Upload/session intake share a user frequency bucket, import has a separate bucket; slot-cap 429 has no frequency Retry-After.
    proposed_target: Approve limit inclusivity and rate-bucket identity, retain per-user isolation and rollback; Java may use a different reservation/coordinator implementation.
    evidence: [tests/canvas-contract/resource_limits_contract_test.go, backend/internal/app/upload_quota.go, backend/internal/handler/user_data.go]
  - id: D-11
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.canvas.list]
    go_observation: Paginated project canvas summaries return revision zero because the query omits the revision column; document and full project detail return the committed revision.
    proposed_target: Return an authoritative positive revision or omit a non-authoritative field explicitly; never use the current page projection as a CAS precondition.
    evidence: [backend/internal/repository/project_workbench_read.go, tests/canvas-contract/contract/schemas/project.v1.schema.json, tests/canvas-contract/canvas_contract_test.go]
  - id: D-12
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [project.create, project.unit.create, project.unit.import]
    go_observation: Same-user duplicate project names return 409/project_name_conflict, names are independent across users, and unit create/import replays append fresh IDs and advance revision once per request.
    proposed_target: Keep owner-scoped name uniqueness and explicit non-idempotent POST semantics without a stable request identity; any automatic retry or deduplication needs a separately approved idempotency contract.
    evidence: [backend/internal/app/project.go, tests/canvas-contract/project_workbench_matrix_contract_test.go]
  - id: D-13
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [canvas.resource.access, canvas.public-resource.file]
    go_observation: Local display access aligns signatures to TTL/4 windows; remaining lifetime is greater than three quarters and at most the configured TTL. Last-Modified conditional reads return 304 only after valid signature authorization. An expired signature is forbidden even with If-Modified-Since; renewing access does not mutate resource revision or stored bytes.
    proposed_target: Approve signing-window and refresh semantics separately; retain authorization-before-cache-revalidation and immutable resource identity across access renewal without prescribing Java storage internals.
    evidence: [tests/canvas-contract/resource_cache_contract_test.go, backend/internal/assets/access.go, backend/internal/handler/resource_delivery.go]
  - id: D-14
    classification: UNKNOWN
    proposal: APPROVED_CHANGE
    approval: pending
    operations: [canvas.resource.import]
    go_observation: A controlled resource URL with no response headers times out server-side after 90 seconds with HTTP 500/internal, cancels one upstream request, and leaves resource IDs and byte usage unchanged; an explicit retry can use the same idempotency key after this proven download failure.
    proposed_target: Retain bounded cancellable outbound reads and no automatic retry; approve the timeout budget and machine-readable error independently rather than requiring Java to copy Go client defaults.
    evidence: [tests/canvas-contract/resource_import_contract_test.go, tests/canvas-contract/harness/resource_fixture.go, backend/internal/app/resource_generated.go]
  - id: D-15
    classification: UNKNOWN
    proposal: APPROVED_CHANGE
    approval: pending
    operations: [canvas.resource.upload.chunk, canvas.resource.upload.complete]
    go_observation: Concurrent different-index chunks both succeed; same-index writes of different equal-length bytes both succeed and the final bytes are one complete candidate. Concurrent completion creates one resource and rejects the other closed-session requests with 404, charging stored bytes once.
    proposed_target: Retain atomic completion and per-user isolation; decide content-fingerprint conflict semantics for same-index replay explicitly instead of equating last-writer replacement with content idempotency.
    evidence: [tests/canvas-contract/resource_concurrency_contract_test.go, backend/internal/handler/resource_upload_session.go]
  - id: D-16
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [canvas.history.list, canvas.history.read, canvas.history.restore]
    go_observation: Rapid ordinary content writes coalesce snapshots; every forced restore, including the same content, advances revision and captures its complete preimage. The latest twenty snapshots remain readable in descending revision order; an evicted snapshot returns 404, while a stale restore revision is rejected before lookup without mutation.
    proposed_target: Retain owner-scoped CAS, atomic preimage capture and non-addressable evicted identities; approve capture windows and retention budgets separately rather than hardcoding Go policy into Java architecture.
    evidence: [tests/canvas-contract/history_retention_contract_test.go, backend/internal/canvas/canvas_history.go, backend/internal/repository/canvas_history.go]
  - id: D-17
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [project.unit.import]
    go_observation: Unit import accepts up to 2500 rows per request and a trimmed 240-Unicode-code-point title; 2501 rows, empty/null batches and a 241-code-point final title reject without changing existing units or project revision. A successful maximum batch appends unique owned units and advances revision once. Both list and import acknowledgements clear sourceText; complete per-unit reads retain the imported body.
    proposed_target: Retain all-or-nothing validation, ownership, source-text persistence and one batch revision; approve numeric limits and Unicode normalization separately instead of binding Java to Go batching internals.
    evidence: [tests/canvas-contract/project_workbench_matrix_contract_test.go, backend/internal/app/project.go, backend/internal/repository/repository_projects.go]
  - id: D-18
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.share.resource-read, canvas.share.revoke, canvas.resource.file, canvas.public-resource.file, canvas.public-resource.file-named]
    go_observation: File access=1 returns a typed private no-store descriptor instead of bytes, ignores byte-range/conditional headers, and preserves metadata, usage and content. Shared descriptors mint an independent public resource signature bounded by the share expiry. Revoking the share rejects its byte and descriptor paths, but the previously issued independent resource signature still reads the bytes until its own expiry.
    proposed_target: Retain explicit representation and authorization validation; decide the scope and maximum latency of revocation for derived bearer capabilities. Do not silently preserve this revocation gap in Java or require Go signing/storage internals. Remote delivery and redirect runtime evidence remain separate gates.
    evidence: [tests/canvas-contract/resource_description_contract_test.go, tests/canvas-contract/contract/file_variants_test.go, backend/internal/handler/resource_delivery.go, backend/internal/canvas/canvas_share.go, backend/internal/app/resource_access.go]
  - id: D-19
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.unit.import, project.unit.read, project.core]
    go_observation: An exactly 32 MiB JSON document containing four real chapter sources is accepted atomically, each full per-unit read preserves its source and the project revision advances once. A JSON document whose closing framing is one byte over the budget returns 400 without any mutation. However, a small complete JSON document followed by whitespace bringing the transmitted body to 32 MiB plus one byte is accepted because the decoder does not consume the remainder; this is not an absolute transmitted-body limit.
    proposed_target: Retain atomic source persistence and reject malformed/over-budget JSON without effects; separately approve the byte budget, ownership/error precedence and trailing-document policy. Enforce the chosen full-body budget at an explicit HTTP boundary rather than copying Go decoder behavior into Java architecture.
    evidence: [tests/canvas-contract/project_import_body_contract_test.go, backend/internal/handler/project_unit_routes.go, backend/internal/app/project.go]
  - id: D-20
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.unit.reorder, project.unit.read, project.core]
    go_observation: Two start-barrier requests send opposite complete permutations with different leading units. In each of six trials in two isolated Go runs, one request returns 200 and one returns a complete 500/internal envelope. Only successful requests advance project revision; the final complete unit DTOs match a successful permutation without partial writes or foreign changes. These HTTP outcomes and the source update order suggest contention but do not prove a specific database deadlock.
    proposed_target: Retain atomic complete permutations and failure rollback; decide the externally visible contention classification and bounded retry/idempotency policy. Do not require Java to expose Go internal errors or use Go row-update/lock order. Controlled failure injection and membership-write competition remain separate paths.
    evidence: [tests/canvas-contract/project_reorder_race_contract_test.go, backend/internal/app/project.go, backend/internal/repository/repository_projects.go]
  - id: D-21
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [project.unit.create, project.unit.delete, project.unit.import, project.unit.reorder, project.unit.read, project.core]
    go_observation: Start-barrier races pair complete reorder with creation, deletion or a two-unit import. In two preliminary runs all nine pairs return two 200 responses; postconditions preserve complete existing/new sources and identities, the surviving permutation, isolated foreign state, and one revision per acknowledged commit. Strengthened scenarios also reject the old complete identity set after an acknowledged membership change without effects. This does not prove a controlled database interleaving, every error branch, workflow cascade or atomicity under injected create/revision failure.
    proposed_target: Preserve membership ownership and atomic acknowledged effects with approved contention/error semantics; use deterministic failure/interleaving fixtures for missing paths. Neither request start timing nor Go default positions define the Java aggregate, transaction or lock architecture.
    evidence: [tests/canvas-contract/project_membership_race_contract_test.go, backend/internal/app/project.go, backend/internal/repository/repository_projects.go]
  - id: D-22
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.resource.upload.chunk, canvas.resource.upload.complete, canvas.resource.list, canvas.resource.usage, canvas.resource.read, canvas.resource.file]
    go_observation: After two chunks have been acknowledged, a short or long replacement of the last chunk returns 400 and a subsequent completion also returns 400 because the earlier acknowledged staged chunk was removed. Re-uploading that chunk permits completion. Start-barrier races cover a missing last chunk or valid/invalid replacement versus completion; acknowledged success determines exact published bytes, quota advances once, closed sessions and foreign access return 404, and metadata remains unchanged on replay. Two isolated runs also declare 13 bytes, send six and half-close the real HTTP write stream; both missing and previously acknowledged chunks return a complete 400 error response, completion returns 400, and explicit replacement recovers exact bytes with one quota charge. This is not proof of every race outcome, controlled interleaving, abrupt connection reset, response loss or physical staging cleanup.
    proposed_target: Approve whether failed replacement must preserve the previously acknowledged staged chunk, and define recoverable failure and completion linearization semantics. A failure must not silently publish partial bytes or double-charge quota. Do not require Java to copy destructive Go file truncation, in-memory sessions or mutex architecture. Abrupt disconnect/response loss, reservation expiry and remote storage remain separate gates.
    evidence: [tests/canvas-contract/resource_completion_race_contract_test.go, tests/canvas-contract/resource_transport_contract_test.go, tests/canvas-contract/runner/interrupted_upload.go, backend/internal/handler/resource_upload_session.go]
  - id: D-23
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.legacy-asset.update, canvas.legacy-asset.read, canvas.legacy-asset.list, canvas.legacy-asset.folder-update, canvas.legacy-asset.folder-delete, canvas.legacy-asset.folder-move, canvas.legacy-asset.delete, canvas.legacy-asset.batch-delete]
    go_observation: >-
      Valid foreign asset upsert returns a complete 500/internal envelope rather than an explicit ownership/not-found response. Foreign folder update/delete and cross-owner move return 400, while foreign purge and mixed own/foreign/missing-ID batch purge return 404. Both user directions and anonymous writes are exercised; complete assets/folders/resource metadata, exact fixture bytes and quota remain unchanged after every failure, including both identity orders and root/owned-folder move destinations. Local object-store DELETE failure is separately exercised: asset/resource rows disappear after the acknowledged purge while the physical object remains for retry. Canvas-reference/purge ordering is a separate decision below.
    proposed_target: Preserve cross-user isolation and all-or-nothing mixed ownership mutations, but approve explicit machine-readable ownership/error semantics without copying Go duplicate-key/internal errors into Java. Do not use frontend hiding or globally unique primary-key conflicts as authorization. Storage retry timing and reference races remain separate required paths.
    evidence: [tests/canvas-contract/legacy_ownership_contract_test.go, backend/internal/canvas/user_data.go, backend/internal/app/asset_library.go, backend/internal/app/resource_delete.go, backend/internal/repository/repository_assets_canvases.go]
  - id: D-31
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.create, canvas.update, canvas.legacy-asset.delete, canvas.resource.read, canvas.legacy-asset.read]
    go_observation: Six start-barrier trials race a canvas PUT containing a resource-backed legacy asset with explicit asset DELETE/purge. Each acknowledged canvas write persists the resource locator; each acknowledged purge removes the asset and resource rows. Some trials acknowledge both requests, leaving the canvas document with a dangling resource locator because current Go purge intentionally invalidates existing references. The local object-store failure path separately leaves the physical object for the asynchronous deletion outbox; neither test proves production retry timing or task/project reference coverage.
    proposed_target: Decide whether Java keeps explicit purge as an authorized dangling-reference transition or serializes/rejects purge while a live canvas references the asset. Whichever policy is approved must define the final canvas/resource/asset invariant, repair behavior, and machine-readable conflict semantics. Do not infer safety from request completion order or copy Go's current dangling-reference behavior without approval.
    evidence: [tests/canvas-contract/legacy_ownership_contract_test.go, backend/internal/canvas/canvas_asset_guard.go, backend/internal/app/resource_delete.go, backend/internal/repository/resource_reference.go]
  - id: D-24
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.share.read, canvas.share.create, canvas.share.revoke, canvas.share.public-read]
    go_observation: Two owner POST requests racing to create the first share for a canvas publish one enabled token; the loser may return a complete 500/internal response from the unique owner/project constraint. The current token is the only public token accepted, the foreign management read is 404, and no duplicate enabled share is visible. This is a start-barrier observation, not proof of every database interleaving, retry behavior, or multi-instance settlement.
    proposed_target: Preserve one authoritative share per owner and canvas with a defined idempotency/concurrency outcome. Prefer an explicit conflict or safe retry policy over leaking a database uniqueness error, but do not require Java to copy Go ORM timing, unique-index error text, or in-memory sequencing. Expiry/rotation/revoke settlement remains separate.
    evidence: [tests/canvas-contract/share_matrix_contract_test.go, backend/internal/canvas/canvas_share.go, backend/internal/model/models_project.go]
  - id: D-25
    classification: UNKNOWN
    proposal: MUST_KEEP
    approval: pending
    operations: [canvas.task.logs]
    go_observation: An authenticated owner request for a missing task log returns a complete 200 response with an empty result rather than a not-found error. The unauthenticated request is rejected before task lookup. This is a selected missing-ID observation, not proof of foreign-task behavior, populated logs, pagination or task existence leakage across every task route.
    proposed_target: Define one owner-scoped policy for missing and foreign task reads. A 200 empty projection can avoid an existence oracle, but Java must make the choice explicit and test populated, missing and foreign records without using the Go handler or repository shape as the design.
    evidence: [tests/canvas-contract/generation_boundary_contract_test.go, backend/internal/handler/routes.go]
  - id: D-26
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.canvas.link, project.canvas.list]
    go_observation: Sequential multi-unit associations normalize trimmed identities and roles, default omitted/blank/null roles to storyboard, and retain one persisted link per project/canvas/unit. Updating or replaying a role returns a fresh link ID while full-detail and paged GET retain the original ID and creation metadata. Every successful link request advances both canvas and project revisions, including identical replay. Selected concurrent existing-role updates and different-unit links both return 200, advancing the canvas and project twice; the final role is one acknowledged complete candidate, and existing identity/creation metadata persist despite generated response IDs. Complete unit bodies, canvas content and history are protected in both user directions; the trials do not prove controlled internal interleaving or all role policies.
    proposed_target: Define one authoritative association identity and return its persisted DTO on update/replay; explicitly approve whether an identical replay advances revisions and which normalized roles are allowed. Keep uniqueness and ownership without requiring Java to copy Go row-update or generated-response-ID behavior. The proposed fix is not an approved wire/behavior change.
    evidence: [tests/canvas-contract/project_link_roles_contract_test.go, tests/canvas-contract/project_link_race_contract_test.go, backend/internal/app/project.go, backend/internal/repository/repository_projects.go]
  - id: D-27
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.canvas.link, project.canvas.list, project.canvas.unlink]
    go_observation: In isolated PostgreSQL 18, a 32-character Unicode role succeeds, but a 33-character role returns a complete 500/internal after canvas assignment and revision advancement. First-time failure leaves the canvas assigned with no unit link and no project revision change; retry advances the canvas again. Overflow updating an existing link retains its role/identity/creation metadata but still advances the canvas. Canvas content, snapshots, full unit bodies and foreign project remain intact. Old-revision canvas PUT is rejected with 409 after the failed link. Valid role recovery and project detach execute through HTTP; no SQL rollback or arbitrary injected failure is proven.
    proposed_target: Approve the role budget and machine-readable validation error before mutation. Commit association, canvas ownership/revision and project revision as an atomic short transaction owned by the target module, with failure/replay/recovery tests. Reject input without durable partial state; do not copy Go non-transactional repository sequencing or SQL error text into Java. Post-commit response ambiguity remains distinct from pre-commit validation failure.
    evidence: [tests/canvas-contract/project_link_roles_contract_test.go, backend/internal/app/project.go, backend/internal/repository/repository_projects.go, backend/internal/model/models_project.go]
  - id: D-28
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [project.canvas.link, project.canvas.list, project.canvas.unlink-unit, project.canvas.unlink]
    go_observation: In selected isolated PostgreSQL trials, two first-time same-key link requests produce one complete 200 and one complete 500/internal. Both requests advance the canvas revision, but only the successful request advances the project revision. Exactly one persisted association survives with the successful role and identity; full units, canvas content and history remain intact. Existing-role and different-unit competition instead acknowledge both requests. Foreign writes and old-revision PUT reject without additional mutation; per-unit removal and project detach settle the observed state. A start barrier does not control database interleaving or prove a particular constraint-error mechanism; a serialized two-success same-key outcome is also source-supported but not claimed as exercised unless logs show it.
    proposed_target: Approve same-key conflict/replay and machine-readable error semantics, then commit authoritative association identity, canvas assignment/revision and project revision atomically through the owning module's public port. Distinguish database uniqueness arbitration from request idempotency, preserve user isolation and complete acknowledged state, and test both controlled overlap and serialized replay. Do not require Java to return internal errors, advance the canvas on rejected insertion or copy Go non-transactional steps; the proposal is not an approved contract change.
    evidence: [tests/canvas-contract/project_link_race_contract_test.go, backend/internal/app/project.go, backend/internal/repository/repository_projects.go, backend/internal/model/models_project.go]
  - id: D-29
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.task.text-delta-create, canvas.task.text-delta-list, canvas.task.text-replay-complete]
    go_observation: In the provider-free text replay path, an authenticated owner can create a text_replay task, append ordered deltas, read them with an after cursor and complete the task once. A foreign user's delta read/write request currently returns HTTP 500/internal because the shared task lookup error is not translated to a resource-scoped not-found response; foreign completion is translated to HTTP 400 by the completion handler. Duplicate completion and post-completion delta writes return HTTP 400; the completed replay returns finalText and complete=true while the retained delta list remains available during its retention window.
    proposed_target: Preserve owner isolation and a single terminal transition, but choose an explicit machine-readable 404/not-found or indistinguishable policy for foreign task access. Keep cursor monotonicity and completion visibility, and decide whether completed deltas remain queryable or are compacted behind finalText. Do not copy Go's internal error status into Java without approval.
    evidence: [tests/canvas-contract/generation_writeback_contract_test.go, backend/internal/handler/routes.go, backend/internal/app/text_replay.go, backend/internal/repository/text_replay.go]
  - id: D-30
    classification: UNKNOWN
    proposal: KNOWN_BUG
    approval: pending
    operations: [canvas.task.read, canvas.task.logs]
    go_observation: An authenticated owner can read an existing task and its logs. A foreign user is excluded from the task list and receives 404 for task detail, but the current logs endpoint returns HTTP 200 with an empty list because it filters by user without first asserting task ownership. Unauthenticated reads remain 401.
    proposed_target: Keep task list, detail and logs consistently resource-scoped. Choose 404/not-found or an indistinguishable empty response for foreign logs, document it as a single policy, and do not make Java reproduce an accidental 200/internal distinction without approval.
    evidence: [tests/canvas-contract/generation_boundary_contract_test.go, backend/internal/handler/routes.go, backend/internal/repository/repository_tasks.go]
