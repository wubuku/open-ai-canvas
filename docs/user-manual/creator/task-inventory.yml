manual_version: 1
target:
  app: yingce-web
  scope: creator
  url: http://localhost:28300
  audience:
    - creator
  depth: standard
tasks:
  - id: register-and-login
    title: 注册与登录
    role: creator
    frequency: common
    impact: medium
    coverage: concise
    evidence:
      - type: route
        note: /login /register /forgot-password 独立路由
    preconditions: []
    routes:
      - /login
      - /register
    status: verified
    manual_pages:
      - 10-tasks/register-and-login.md

  - id: use-canvas
    title: 使用自由画布进行创作
    role: creator
    frequency: core
    impact: high
    coverage: flagship
    evidence:
      - type: user-confirmed
        note: 用户确认自由画布为最高优先级
    preconditions:
      - 已登录
    routes:
      - /canvas
      - /canvas/:id
    status: verified
    manual_pages:
      - 10-tasks/use-canvas.md

  - id: generate-image
    title: 用提示词生成图片
    role: creator
    frequency: core
    impact: medium
    coverage: full
    evidence:
      - type: ui-cta
        note: 首页主 CTA，图片模式
    preconditions:
      - 已登录
      - 有可用积分
    routes:
      - /create
    status: verified
    manual_pages:
      - 10-tasks/generate-image.md

  - id: create-modes
    title: 选择创作模式
    role: creator
    frequency: core
    impact: medium
    coverage: full
    evidence:
